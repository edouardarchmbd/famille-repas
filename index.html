<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Repas">
<title>Repas famille</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
  :root {
    --bg:#f7f6f2;--surface:#fff;--border:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.18);
    --text:#1a1a1a;--text-2:#6b6b6b;--text-3:#aaa;
    --purple-bg:#eeedfe;--purple-bd:#afa9ec;--purple-txt:#3c3489;
    --pink-bg:#fbeaf0;--pink-bd:#ed93b1;--pink-txt:#72243e;
    --green-bg:#eaf3de;--green-bd:#97c459;--green-txt:#27500a;
    --teal-bg:#e1f5ee;--teal-bd:#5dcaa5;--teal-txt:#085041;
    --amber-bg:#faeeda;--amber-bd:#ef9f27;--amber-txt:#633806;
    --blue-bg:#e6f1fb;--blue-bd:#85b7eb;--blue-txt:#0c447c;
    --coral-bg:#faece7;--coral-txt:#993c1d;
    --red-bd:rgba(220,60,60,0.4);--red-txt:#a32d2d;
    --accent:#534ab7;--radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  .sync-badge{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--teal-bg);color:var(--teal-txt);display:flex;align-items:center;gap:5px}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#1d9e75}
  .sync-badge.offline{background:#f1efea;color:var(--text-3)}
  .sync-badge.offline .sync-dot{background:var(--text-3)}

  /* ===== IPHONE ===== */
  #view-iphone{display:none;max-width:480px;margin:0 auto;padding-bottom:80px}
  .iphone-header{background:var(--bg);padding:20px 20px 14px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}
  .iphone-title{font-size:24px;font-weight:500;color:var(--text)}
  .iphone-tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--surface)}
  .iphone-tab{flex:1;padding:12px 4px;font-size:13px;font-weight:500;color:var(--text-2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
  .iphone-tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .iphone-tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
  .iphone-list{padding:8px 16px 0}
  .iphone-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:0.5px solid var(--border)}
  .iphone-item:last-child{border-bottom:none}
  .iphone-cb{width:26px;height:26px;border-radius:7px;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .iphone-cb.done{background:#1d9e75;border-color:#1d9e75}
  .iphone-cb svg{width:14px;height:14px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .iphone-name{font-size:18px;color:var(--text);flex:1}
  .iphone-name.done{text-decoration:line-through;color:var(--text-3)}
  .iphone-del{border:none;background:none;cursor:pointer;color:var(--text-3);padding:4px;display:flex}
  .iphone-del svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .iphone-empty{text-align:center;padding:70px 20px;font-size:16px;color:var(--text-3);line-height:1.7}
  .iphone-clear-wrap{padding:16px}
  .iphone-clear{width:100%;padding:13px;font-size:14px;font-weight:500;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif}
  .iphone-clear svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .iphone-add-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:var(--surface);border-top:0.5px solid var(--border);display:flex;gap:8px}
  .iphone-add-bar input{flex:1;padding:13px 14px;font-size:16px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
  .iphone-add-bar input:focus{border-color:var(--accent);background:var(--surface)}
  .iphone-add-bar button{padding:13px 18px;font-size:15px;font-weight:500;border:none;border-radius:var(--radius);background:var(--accent);color:white;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
  .iphone-week-nav{display:flex;align-items:center;gap:8px;padding:10px 0 14px}
  .iphone-week-nav span{font-size:16px;font-weight:500;color:var(--text);flex:1}
  .iphone-day-block{margin-bottom:20px}
  .iphone-day-header{font-size:13px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--border)}
  .iphone-day-header .today-num{color:var(--accent)}
  .iphone-day-header.weekend-hdr{color:var(--amber-txt)}
  .iphone-slot{display:flex;align-items:stretch;gap:10px;margin-bottom:8px}
  .iphone-slot-label{font-size:11px;color:var(--text-3);width:30px;flex-shrink:0;padding-top:12px;text-align:right}
  .iphone-slot-cell{flex:1;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface);min-height:56px;cursor:pointer;display:flex;align-items:center}
  .iphone-slot-cell.empty{border-style:dashed;justify-content:center}
  .iphone-slot-cell.empty svg{width:18px;height:18px;stroke:var(--border-mid);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .iphone-slot-inner{padding:10px 12px;width:100%}
  .iphone-meal-name{font-size:14px;font-weight:500;margin-bottom:3px}
  .iphone-meal-remove{float:right;border:none;background:none;cursor:pointer;opacity:0.4;padding:0 0 0 8px}
  .iphone-meal-remove svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  /* recettes iphone */
  .iphone-recipe-list{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
  .iphone-recipe-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .iphone-recipe-name{font-size:14px;font-weight:500;color:var(--text);flex:1}

  /* ===== IPAD ===== */
  #view-ipad{display:none;max-width:768px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;background:var(--bg);position:sticky;top:0;z-index:10}
  .week-nav{display:flex;align-items:center;gap:8px}
  .week-label{font-size:18px;font-weight:500;color:var(--text)}
  .nav-arrow{font-size:26px;line-height:1;border:none;background:none;cursor:pointer;color:var(--text-2);padding:4px 8px;border-radius:var(--radius-sm)}
  .nav-arrow:active{background:var(--border)}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .avatars{display:flex;gap:5px}
  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
  .av-e{background:var(--purple-bg);color:var(--purple-txt)}
  .av-c{background:var(--pink-bg);color:var(--pink-txt)}
  .av-m{background:var(--green-bg);color:var(--green-txt)}
  .tabs{display:flex;background:var(--surface);border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border);position:sticky;top:65px;z-index:10}
  .tab{flex:1;padding:14px 4px;font-size:14px;font-weight:500;text-align:center;color:var(--text-2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
  .tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
  .pane{display:none;padding:16px 20px 100px}
  .pane.active{display:block}

  /* planning ipad */
  .col-headers{display:grid;grid-template-columns:58px 1fr 1fr;gap:5px;margin-bottom:6px}
  .col-h{font-size:13px;font-weight:500;color:var(--text-2);text-align:center;padding:8px 6px;background:var(--surface);border-radius:var(--radius-sm);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px}
  .col-h svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .day-row{display:grid;grid-template-columns:58px 1fr 1fr;gap:5px;margin-bottom:5px;align-items:start}
  .day-row.weekend-row .day-num{color:var(--amber-txt)}
  .day-lbl{display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px}
  .day-name{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.04em}
  .day-num{font-size:22px;font-weight:500;color:var(--text);line-height:1.1}
  .day-num.today{color:var(--accent)}
  .cell{border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface);min-height:90px;cursor:pointer;transition:border-color 0.12s}
  .cell:active{opacity:0.85}
  .cell.empty{display:flex;align-items:center;justify-content:center;border-style:dashed}
  .cell.empty svg{width:22px;height:22px;stroke:var(--border-mid);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .cell-inner{padding:9px 11px}
  .meal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
  .meal-name{font-size:13px;font-weight:500;line-height:1.3;flex:1}
  .cell-remove{border:none;background:none;cursor:pointer;padding:0 0 0 4px;opacity:0.4;display:flex;align-items:center}
  .cell-remove svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .person-line{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);margin-bottom:2px;line-height:1.4}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot-e{background:var(--purple-bd)}.dot-c{background:var(--pink-bd)}.dot-m{background:var(--green-bd)}
  .cook-flag{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--coral-bg);color:var(--coral-txt);margin-top:4px;display:inline-block}
  .free-badge{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--purple-bg);color:var(--purple-txt);margin-top:4px;display:inline-block}

  /* recettes */
  .recipe-list{display:flex;flex-direction:column;gap:5px}
  .recipe-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .recipe-emoji-btn{font-size:20px;width:34px;height:34px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .recipe-info{flex:1;min-width:0}
  .recipe-row-name{font-size:15px;font-weight:500;color:var(--text)}
  .tag-pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block;margin-top:3px}
  .tag-v{background:var(--teal-bg);color:var(--teal-txt)}
  .tag-p{background:var(--blue-bg);color:var(--blue-txt)}
  .tag-vi{background:var(--amber-bg);color:var(--amber-txt)}
  .recipe-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:4px;border-radius:var(--radius-sm)}
  .recipe-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .add-block{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .add-block input{width:100%;padding:10px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
  .add-block input:focus{border-color:var(--accent)}
  .emoji-row{display:flex;gap:6px;flex-wrap:wrap}
  .emoji-opt{font-size:20px;width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .emoji-opt.selected{border-color:var(--accent);background:var(--purple-bg)}
  .tag-picker{display:flex;gap:6px}
  .tag-btn{flex:1;padding:8px 4px;font-size:12px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:20px;background:var(--surface);cursor:pointer;color:var(--text-2);font-family:'DM Sans',sans-serif}
  .tag-btn.sel-v{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal-txt)}
  .tag-btn.sel-p{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-txt)}
  .tag-btn.sel-vi{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-txt)}
  .add-submit{padding:10px;font-size:14px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif}
  .add-submit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ia-block{margin-top:14px}
  .ia-label{font-size:9px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
  .ia-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px}
  .ia-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px}
  .ia-action{width:100%;margin-top:10px;padding:9px;font-size:12px;border:0.5px dashed var(--border-mid);border-radius:var(--radius-sm);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
  .ia-action svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* courses */
  .shop-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
  .shop-item:last-child{border-bottom:none}
  .cb{width:22px;height:22px;border-radius:5px;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .cb.done{background:#1d9e75;border-color:#1d9e75}
  .cb svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .item-name{font-size:15px;color:var(--text);flex:1}
  .item-name.done{text-decoration:line-through;color:var(--text-3)}
  .item-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:3px}
  .item-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .shop-add{display:flex;gap:6px;margin-top:10px}
  .shop-add input{flex:1;padding:10px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
  .shop-add input:focus{border-color:var(--accent)}
  .shop-add button{padding:10px 16px;font-size:14px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px}
  .shop-add button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .clear-btn{width:100%;margin-top:12px;padding:10px;font-size:13px;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif;font-weight:500}
  .clear-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .empty-state{text-align:center;padding:30px 0;font-size:14px;color:var(--text-3)}

  /* recap dimanche */
  .recap-section{margin-bottom:20px}
  .recap-title{font-size:12px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
  .recap-empty{font-size:14px;color:var(--text-3);padding:16px 0}
  .recap-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);margin-bottom:6px}
  .recap-when{font-size:11px;color:var(--text-2);width:80px;flex-shrink:0}
  .recap-meal{font-size:14px;font-weight:500;color:var(--text)}

  /* modal */
  .modal-backdrop{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.4);align-items:flex-end;justify-content:center}
  .modal-backdrop.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:768px;padding:16px;max-height:75vh;display:flex;flex-direction:column}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .modal-title{font-size:16px;font-weight:500;color:var(--text)}
  .modal-close{border:none;background:none;cursor:pointer;padding:4px;color:var(--text-2);display:flex;align-items:center}
  .modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .modal-free{display:flex;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border)}
  .modal-free input{flex:1;padding:9px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
  .modal-free input:focus{border-color:var(--accent)}
  .modal-free button{padding:9px 14px;font-size:13px;font-weight:500;border:none;border-radius:var(--radius);background:var(--accent);color:white;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
  .modal-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px}
  .modal-recipe{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;width:100%;text-align:left;font-family:'DM Sans',sans-serif}
  .modal-recipe:active{background:var(--bg)}
  .modal-recipe-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .modal-recipe-name{font-size:14px;font-weight:500;color:var(--text);flex:1}
  .modal-footer{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
  .modal-clear{width:100%;padding:10px;font-size:13px;font-weight:500;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif}
  .modal-clear svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

  /* emoji picker modal */
  .emoji-modal-backdrop{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:24px}
  .emoji-modal-backdrop.open{display:flex}
  .emoji-modal{background:var(--surface);border-radius:var(--radius);padding:16px;width:100%;max-width:320px}
  .emoji-modal-title{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--text)}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .emoji-pick{font-size:22px;width:42px;height:42px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .emoji-pick.sel{border-color:var(--accent);background:var(--purple-bg)}
  .emoji-modal-actions{display:flex;gap:8px}
  .emoji-modal-cancel{flex:1;padding:9px;font-size:13px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:transparent;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif}

async function loadShopFromSupabase(){

  setSyncStatus(true);shopItems=data.map(r=>({id:r.id,name:r.name,done:r.done}));

}
async function loadRecipesFromSupabase(){
  const{data,error}=await sb.from('recipes').select('*').order('created_at',{ascending:true});

    // hors ligne : on utilise le cache localStorage
    recipes=lsLoad('recipes_cache',[]);renderRecipes();renderIphoneRecipes();return;

  if(data.length===0){
    // Première utilisation : insérer les recettes de base dans Supabase
    const{data:inserted}=await sb.from('recipes').insert(BASE_RECIPES).select();

// ---- SUBSCRIPTIONS ----
function subscribeShop(){
  sb.channel('courses-rt').on('postgres_changes',{event:'*',schema:'public',table:'courses'},payload=>{
    const{eventType,new:n,old:o}=payload;
    if(eventType==='INSERT'){
      const pk=String(n.name+false);if(_pendingIds.has(pk)){_pendingIds.delete(pk);return}
      if(!shopItems.find(i=>i.id===n.id)){shopItems.push({id:n.id,name:n.name,done:n.done});lsSave('shopItems',shopItems);renderShop()}
    } else if(eventType==='UPDATE'){
      const item=shopItems.find(i=>i.id===n.id);
      if(item){item.done=n.done;item.name=n.name;lsSave('shopItems',shopItems);renderShop()}
    } else if(eventType==='DELETE'){
      shopItems=shopItems.filter(i=>i.id!==o.id);lsSave('shopItems',shopItems);renderShop()
    }

}
function subscribePlanning(){

function subscribeRecipes(){

    if(eventType==='INSERT'){
      if(!recipes.find(r=>r.id===n.id)){

      if(r){r.emoji=n.emoji||'🍽️';lsSave('recipes',recipes);renderRecipes();renderIphoneRecipes()}
    } else if(eventType==='DELETE'){
      recipes=recipes.filter(r=>r.id!==o.id);lsSave('recipes',recipes);renderRecipes();renderIphoneRecipes()
    }
  }).subscribe();
}

// ---- PLANNING ----
function getWeekStart(offset){
  const d=new Date();const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const m=new Date(d);m.setDate(diff+offset*7);m.setHours(0,0,0,0);return m;
}
function getWeekLabel(offset){
  const m=getWeekStart(offset);return'Semaine du '+m.getDate()+' '+MONTHS[m.getMonth()];
}
function changeWeek(dir){
  weekOffset+=dir;lsSave('weekOffset',weekOffset);
  const wl=document.getElementById('week-label');if(wl)wl.textContent=getWeekLabel(weekOffset);
  updateTodayBtn();
  if(isPhone)renderIphonePlanning();else{renderPlanning();renderRecap()}
}
function goToToday(){
  weekOffset=0;lsSave('weekOffset',0);
  const wl=document.getElementById('week-label');if(wl)wl.textContent=getWeekLabel(0);
  updateTodayBtn();
  if(isPhone)renderIphonePlanning();else{renderPlanning();renderRecap()}
}
function updateTodayBtn(){
  ['today-btn','iphone-today-btn'].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display=weekOffset===0?'none':'inline-block'});
}
function slotKey(di,slot){return weekOffset+'_'+di+'_'+slot}
function personContext(p,di){return p[['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'][di]]||''}
function isToday(di){
  const ws=getWeekStart(weekOffset);const d=new Date(ws);d.setDate(ws.getDate()+di);
  const now=new Date();
  return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
}

function getSlotData(key){
  const v=planning[key];if(!v)return null;
  if(typeof v==='number'){return{recipe_id:v,free_text:null}} // legacy
  return v;
}
function getSlotDisplay(key){
  const v=getSlotData(key);if(!v)return null;
  if(v.free_text)return{name:v.free_text,emoji:'📝',col:COLORS.default,isFree:true};
  const r=recipes.find(r=>r.id===v.recipe_id);if(!r)return null;
  return{name:r.name,emoji:r.emoji||'🍽️',col:COLORS[r.colorKey]||COLORS.default,isFree:false};
}

function renderPlanning(){
  const container=document.getElementById('planning-rows');if(!container)return;
  container.innerHTML='';const ws=getWeekStart(weekOffset);
  ALL_DAYS.forEach((day,di)=>{
    const isWeekend=di>=5;
    const row=document.createElement('div');row.className='day-row'+(isWeekend?' weekend-row':'');
    const d=new Date(ws);d.setDate(ws.getDate()+di);
    const lbl=document.createElement('div');lbl.className='day-lbl';
    lbl.innerHTML='<span class="day-name">'+day+'</span><span class="day-num'+(isToday(di)?' today':'')+'">'+d.getDate()+'</span>';
    row.appendChild(lbl);
    ['midi','soir'].forEach(slot=>{
      const key=slotKey(di,slot);
      const sd=getSlotDisplay(key);
      const cell=document.createElement('div');
      cell.className='cell'+(sd?'':' empty');
      if(sd){cell.style.background=sd.col.bg;cell.style.borderColor=sd.col.bd}
      const isCook=sd&&!sd.isFree&&((slot==='midi'&&di<=2)||(slot==='soir'&&di<=1));
      if(sd){
        let html='<div class="cell-inner"><div class="meal-top"><span class="meal-name" style="color:'+sd.col.txt+'">'+sd.emoji+' '+esc(sd.name)+'</span>';
        html+='<button class="cell-remove" onclick="event.stopPropagation();removeSlot(\''+key+'\')" aria-label="retirer"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
        // prénoms masqués
        if(isCook)html+='<div class="cook-flag">dim. soir</div>';
        if(sd.isFree)html+='<div class="free-badge">à la volée</div>';
        html+='</div>';cell.innerHTML=html;
      } else {
        cell.innerHTML='<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
      }
      cell.onclick=()=>openModal(key,day,slot);row.appendChild(cell);
    });
    container.appendChild(row);
  });
}

// ---- RECAP DIMANCHE ----
function renderRecap(){
  const el=document.getElementById('recap-content');if(!el)return;
  // repas lun-mer (di 0,1,2) + sam soir / dim (di 5,6)
  const targets=[
    {di:0,slot:'midi',label:'Lun midi'},{di:0,slot:'soir',label:'Lun soir'},
    {di:1,slot:'midi',label:'Mar midi'},{di:1,slot:'soir',label:'Mar soir'},
    {di:2,slot:'midi',label:'Mer midi'},{di:2,slot:'soir',label:'Mer soir'},
  ];
  const items=targets.map(t=>{
    const key=slotKey(t.di,t.slot);const sd=getSlotDisplay(key);
    return sd?{label:t.label,sd}:null;
  }).filter(Boolean);

  if(!items.length){
    el.innerHTML='<div class="recap-section"><div class="recap-title">À cuisiner ce dimanche soir</div><div class="recap-empty">Aucun repas planifié pour lundi au mercredi.</div></div>';
    return;
  }

  // dédupliquer par nom de repas
  const seen=new Set();const unique=[];
  items.forEach(item=>{
    if(!seen.has(item.sd.name)){seen.add(item.sd.name);unique.push(item)}
  });

  let html='<div class="recap-section"><div class="recap-title">À cuisiner ce dimanche soir</div>';
  unique.forEach(item=>{
    const col=item.sd.col;
    html+='<div class="recap-item" style="background:'+col.bg+';border:0.5px solid '+col.bd+'"><span class="recap-meal">'+item.sd.emoji+' '+esc(item.sd.name)+'</span></div>';
  });
  html+='</div>';

  html+='<div class="recap-section"><div class="recap-title">Planning détail</div>';
  items.forEach(item=>{
    const col=item.sd.col;
    html+='<div class="recap-item" style="background:'+col.bg+';border:0.5px solid '+col.bd+'"><span class="recap-when">'+item.label+'</span><span class="recap-meal">'+item.sd.emoji+' '+esc(item.sd.name)+'</span></div>';
  });
  html+='</div>';
  el.innerHTML=html;
}

    if(!error&&data){recipes.push({id:data.id,name:data.name,tag:data.tag,colorKey:'default',emoji});lsSave('recipes',recipes);renderRecipes();renderIphoneRecipes();alert('Recette ajoutée !');return}
  }
  recipes.push({id:Date.now(),name:s.name,tag:s.tag,colorKey:'default',emoji});
  lsSave('recipes',recipes);renderRecipes();renderIphoneRecipes();alert('Recette ajoutée !');
}
function renderSuggestion(){
  const s=SUGGESTIONS[suggIdx];const m=TAG_META[s.tag];
  const n=document.getElementById('ia-name');const t=document.getElementById('ia-tag');
  if(n)n.textContent=s.name;if(t)t.innerHTML='<span class="tag-pill '+m.cls+'">'+m.label+'</span>';
}

function showTab(name,el){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');el.classList.add('active');
  if(name==='recap')renderRecap();
}
