<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Famille">
<title>Famille</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
:root{
  --bg:#f7f6f2;--surface:#fff;--border:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.18);
  --text:#1a1a1a;--text-2:#6b6b6b;--text-3:#aaa;
  --purple-bg:#eeedfe;--purple-bd:#afa9ec;--purple-txt:#3c3489;
  --pink-bg:#fbeaf0;--pink-bd:#ed93b1;--pink-txt:#72243e;
  --green-bg:#eaf3de;--green-bd:#97c459;--green-txt:#27500a;
  --teal-bg:#e1f5ee;--teal-bd:#5dcaa5;--teal-txt:#085041;
  --amber-bg:#faeeda;--amber-bd:#ef9f27;--amber-txt:#633806;
  --blue-bg:#e6f1fb;--blue-bd:#85b7eb;--blue-txt:#0c447c;
  --coral-bg:#faece7;--coral-txt:#993c1d;
  --red-bd:rgba(220,60,60,0.4);--red-txt:#a32d2d;
  --warn-bg:#fff8e6;--warn-bd:#f0b429;--warn-txt:#7a5a00;
  --accent:#534ab7;--radius:10px;--radius-sm:6px;
  --bottom-bar-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:var(--bottom-bar-h)}

/* ===== BOTTOM BAR ===== */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-bar-h);background:var(--surface);border-top:0.5px solid var(--border);display:flex;align-items:stretch;z-index:50;max-width:768px;margin:0 auto}
.bb-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--text-3);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;padding-bottom:4px}
.bb-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bb-btn.active{color:var(--accent)}
.section{display:none;max-width:768px;margin:0 auto}
.section.active{display:block}

/* ===== SHARED TOPBAR ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;background:var(--bg);position:sticky;top:0;z-index:10}
.week-nav{display:flex;align-items:center;gap:8px}
.week-label{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap}
.nav-arrow{font-size:26px;line-height:1;border:none;background:none;cursor:pointer;color:var(--text-2);padding:4px 8px;border-radius:var(--radius-sm)}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-badge{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--teal-bg);color:var(--teal-txt);display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#1d9e75}
.sync-badge.offline{background:#f1efea;color:var(--text-3)}
.sync-badge.offline .sync-dot{background:var(--text-3)}
.avatars{display:flex;gap:5px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.av-e{background:var(--purple-bg);color:var(--purple-txt)}
.av-c{background:var(--pink-bg);color:var(--pink-txt)}
.av-m{background:var(--green-bg);color:var(--green-txt)}
.section-tabs{display:flex;background:var(--surface);border-top:0.5px solid var(--border);border-bottom:0.5px solid var(--border);position:sticky;top:58px;z-index:9}
.stab{flex:1;padding:12px 4px;font-size:14px;font-weight:500;text-align:center;color:var(--text-2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
.stab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.pane{display:none;padding:16px 20px 100px}
.pane.active{display:block}

/* ===== PLANNING (repas) ===== */
.col-headers{display:grid;grid-template-columns:58px 1fr 1fr;gap:5px;margin-bottom:6px}
.col-h{font-size:13px;font-weight:500;color:var(--text-2);text-align:center;padding:8px 6px;background:var(--surface);border-radius:var(--radius-sm);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px}
.col-h svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.day-row{display:grid;grid-template-columns:58px 1fr 1fr;gap:5px;margin-bottom:5px;align-items:stretch}
.day-row.weekend-row .day-num{color:var(--amber-txt)}
.day-lbl{display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px}
.day-name{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.04em}
.day-num{font-size:22px;font-weight:500;color:var(--text);line-height:1.1}
.day-num.today{color:var(--accent)}
.cell{border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface);min-height:90px;cursor:pointer;transition:border-color 0.12s;display:flex;flex-direction:column}
.cell:active{opacity:0.85}
.cell.empty{align-items:center;justify-content:center;border-style:dashed}
.cell.empty svg{width:22px;height:22px;stroke:var(--border-mid);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cell-inner{padding:9px 11px;display:flex;flex-direction:column;flex:1}
.meal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.meal-name{font-size:13px;font-weight:500;line-height:1.3;flex:1}
.cell-remove{border:none;background:none;cursor:pointer;padding:0 0 0 4px;opacity:0.4;display:flex;align-items:center}
.cell-remove svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cell-footer{margin-top:auto;padding-top:6px}
.initials-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.initial-btn{width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.initial-btn.neutral-e{background:var(--purple-bg);color:var(--purple-txt)}
.initial-btn.neutral-c{background:var(--pink-bg);color:var(--pink-txt)}
.initial-btn.neutral-m{background:var(--green-bg);color:var(--green-txt)}
.exception-line{display:flex;align-items:center;gap:6px;margin-top:5px;padding-top:5px;border-top:0.5px solid rgba(0,0,0,0.07)}
.exception-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.exception-dot-e{background:var(--purple-bd)}
.exception-dot-c{background:var(--pink-bd)}
.exception-dot-m{background:var(--green-bd)}
.exception-text{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.cook-flag{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--coral-bg);color:var(--coral-txt);display:inline-block}
.free-badge{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--purple-bg);color:var(--purple-txt);display:inline-block}

/* ===== RECETTES ===== */
.recipe-list{display:flex;flex-direction:column;gap:5px}
.recipe-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.recipe-emoji-btn{font-size:20px;width:34px;height:34px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.recipe-info{flex:1;min-width:0}
.recipe-row-name{font-size:15px;font-weight:500;color:var(--text)}
.tag-pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block;margin-top:3px}
.tag-v{background:var(--teal-bg);color:var(--teal-txt)}
.tag-p{background:var(--blue-bg);color:var(--blue-txt)}
.tag-vi{background:var(--amber-bg);color:var(--amber-txt)}
.recipe-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:4px;border-radius:var(--radius-sm)}
.recipe-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.add-block{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);display:flex;flex-direction:column;gap:8px}
.add-block input,.shop-add input,.form-input{width:100%;padding:10px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
.add-block input:focus,.shop-add input:focus,.form-input:focus{border-color:var(--accent)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-opt{font-size:20px;width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.emoji-opt.selected{border-color:var(--accent);background:var(--purple-bg)}
.tag-picker{display:flex;gap:6px}
.tag-btn{flex:1;padding:8px 4px;font-size:12px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:20px;background:var(--surface);cursor:pointer;color:var(--text-2);font-family:'DM Sans',sans-serif}
.tag-btn.sel-v{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal-txt)}
.tag-btn.sel-p{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-txt)}
.tag-btn.sel-vi{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-txt)}
.add-submit,.btn-primary{padding:10px;font-size:14px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif;width:100%}
.btn-primary{background:var(--accent);color:white;border:none}
.add-submit svg,.btn-primary svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ia-block{margin-top:14px}
.ia-label{font-size:9px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.ia-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.ia-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px}
.ia-action{width:100%;margin-top:10px;padding:9px;font-size:12px;border:0.5px dashed var(--border-mid);border-radius:var(--radius-sm);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif}
.ia-action svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== COURSES ===== */
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.shop-item:last-child{border-bottom:none}
.cb{width:22px;height:22px;border-radius:5px;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cb.done{background:#1d9e75;border-color:#1d9e75}
.cb svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.item-name{font-size:15px;color:var(--text);flex:1}
.item-name.done{text-decoration:line-through;color:var(--text-3)}
.item-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:3px}
.item-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.shop-add{display:flex;gap:6px;margin-top:10px}
.shop-add input{flex:1;width:auto}
.shop-add button{padding:10px 16px;font-size:14px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px}
.shop-add button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.clear-btn{width:100%;margin-top:12px;padding:10px;font-size:13px;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif;font-weight:500}
.clear-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty-state{text-align:center;padding:30px 0;font-size:14px;color:var(--text-3)}

/* ===== RECAP DIMANCHE ===== */
.recap-section{margin-bottom:20px}
.recap-title{font-size:12px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
.recap-empty{font-size:14px;color:var(--text-3);padding:16px 0}
.recap-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);margin-bottom:6px}
.recap-when{font-size:11px;color:var(--text-2);width:80px;flex-shrink:0}
.recap-meal{font-size:14px;font-weight:500;color:var(--text)}

/* ===== MENAGE ===== */
.menage-section-label{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin:16px 0 8px}
.menage-task{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:6px}
.menage-task.done-task{opacity:0.6}
.menage-cb{width:22px;height:22px;border-radius:50%;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.menage-cb.done{background:#1d9e75;border-color:#1d9e75}
.menage-cb svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.menage-task-info{flex:1;min-width:0}
.menage-task-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.menage-task-name.done{text-decoration:line-through;color:var(--text-3)}
.menage-task-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.menage-task-warn{font-size:11px;color:var(--warn-txt);background:var(--warn-bg);border:0.5px solid var(--warn-bd);border-radius:4px;padding:2px 6px;margin-top:4px;display:inline-block}
.menage-assigned{display:flex;gap:3px;margin-top:5px}
.menage-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:3px;flex-shrink:0}
.menage-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.recurrence-pill{font-size:9px;padding:2px 6px;border-radius:10px;background:var(--blue-bg);color:var(--blue-txt);font-weight:500;display:inline-block;margin-top:3px}
.person-pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;cursor:pointer;border:none}
.person-pill-e{background:var(--purple-bg);color:var(--purple-txt)}
.person-pill-c{background:var(--pink-bg);color:var(--pink-txt)}
.person-pill-b{background:var(--green-bg);color:var(--green-txt)}
.add-volée-btn{width:100%;padding:10px;font-size:13px;border:0.5px dashed var(--border-mid);border-radius:var(--radius);background:transparent;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif;margin-top:10px}
.add-volée-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.config-task-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:6px}
.config-task-info{flex:1;min-width:0}
.config-task-name{font-size:13px;font-weight:500;color:var(--text)}
.config-task-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.select-input{padding:8px 10px;font-size:13px;border:0.5px solid var(--border-mid);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none;width:100%}
.select-input:focus{border-color:var(--accent)}

/* ===== TODO ===== */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:6px}
.todo-item.done-task{opacity:0.55}
.todo-cb{width:22px;height:22px;border-radius:6px;border:0.5px solid var(--border-mid);background:var(--surface);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.todo-cb.done{background:#1d9e75;border-color:#1d9e75}
.todo-cb svg{width:12px;height:12px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.todo-info{flex:1;min-width:0}
.todo-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.todo-name.done{text-decoration:line-through;color:var(--text-3)}
.todo-meta{font-size:11px;color:var(--text-3);margin-top:3px}
.todo-del{border:none;background:none;cursor:pointer;color:var(--text-3);display:flex;align-items:center;padding:3px;flex-shrink:0}
.todo-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.todo-add-bar{display:flex;gap:8px;margin-top:12px}
.todo-add-bar input{flex:1;padding:10px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
.todo-add-bar input:focus{border-color:var(--accent)}
.todo-assign-picker{display:flex;gap:6px;margin-top:8px}
.todo-assign-btn{flex:1;padding:8px 4px;font-size:12px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:20px;background:var(--surface);cursor:pointer;color:var(--text-2);font-family:'DM Sans',sans-serif}
.todo-assign-btn.sel-e{background:var(--purple-bg);border-color:var(--purple-bd);color:var(--purple-txt)}
.todo-assign-btn.sel-c{background:var(--pink-bg);border-color:var(--pink-bd);color:var(--pink-txt)}
.todo-assign-btn.sel-b{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-txt)}

/* ===== MODALS ===== */
.modal-backdrop{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.4);align-items:flex-end;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:768px;padding:16px;max-height:75vh;display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-title{font-size:16px;font-weight:500;color:var(--text)}
.modal-close{border:none;background:none;cursor:pointer;padding:4px;color:var(--text-2);display:flex;align-items:center}
.modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.modal-free{display:flex;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border)}
.modal-free input{flex:1;padding:9px 12px;font-size:14px;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;outline:none}
.modal-free input:focus{border-color:var(--accent)}
.modal-free button{padding:9px 14px;font-size:13px;font-weight:500;border:none;border-radius:var(--radius);background:var(--accent);color:white;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.modal-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px}
.modal-recipe{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;width:100%;text-align:left;font-family:'DM Sans',sans-serif}
.modal-recipe:active{background:var(--bg)}
.modal-recipe-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.modal-recipe-name{font-size:14px;font-weight:500;color:var(--text);flex:1}
.modal-footer{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)}
.modal-clear{width:100%;padding:10px;font-size:13px;font-weight:500;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif}
.modal-clear svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.confirm-backdrop{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:24px}
.confirm-backdrop.open{display:flex}
.confirm-box{background:var(--surface);border-radius:var(--radius);padding:20px;width:100%;max-width:320px}
.confirm-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px}
.confirm-msg{font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.5}
.confirm-actions{display:flex;gap:8px}
.confirm-cancel{flex:1;padding:9px;font-size:13px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:transparent;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif}
.confirm-ok{flex:1;padding:9px;font-size:13px;font-weight:500;border:0.5px solid var(--red-bd);border-radius:var(--radius);background:transparent;color:var(--red-txt);cursor:pointer;font-family:'DM Sans',sans-serif}
.emoji-modal-backdrop{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:24px}
.emoji-modal-backdrop.open{display:flex}
.emoji-modal{background:var(--surface);border-radius:var(--radius);padding:16px;width:100%;max-width:320px}
.emoji-modal-title{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--text)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.emoji-pick{font-size:22px;width:42px;height:42px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.emoji-pick.sel{border-color:var(--accent);background:var(--purple-bg)}
.emoji-modal-actions{display:flex;gap:8px}
.emoji-modal-cancel{flex:1;padding:9px;font-size:13px;font-weight:500;border:0.5px solid var(--border-mid);border-radius:var(--radius);background:transparent;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif}
.emoji-modal-ok{flex:1;padding:9px;font-size:13px;font-weight:500;border:none;border-radius:var(--radius);background:var(--accent);color:white;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>

// ===== LOAD / SUBSCRIBE SHOP =====
async function loadShopFromSupabase(){
  const{data,error}=await sb.from('courses').select('*').order('created_at',{ascending:true});
  if(error){setSyncStatus(false);shopItems=lsLoad('shopItems',[]);renderShop();return;}
  setSyncStatus(true);shopItems=data.map(r=>({id:r.id,name:r.name,done:r.done}));
  lsSave('shopItems',shopItems);renderShop();
}
function subscribeShop(){
  sb.channel('courses-rt').on('postgres_changes',{event:'*',schema:'public',table:'courses'},payload=>{
    const{eventType,new:n,old:o}=payload;
    if(eventType==='INSERT'){if(!shopItems.find(i=>i.id===n.id)){shopItems.push({id:n.id,name:n.name,done:n.done});lsSave('shopItems',shopItems);renderShop();}}
    else if(eventType==='UPDATE'){const item=shopItems.find(i=>i.id===n.id);if(item){item.done=n.done;item.name=n.name;lsSave('shopItems',shopItems);renderShop();}}
    else if(eventType==='DELETE'){shopItems=shopItems.filter(i=>i.id!==o.id);lsSave('shopItems',shopItems);renderShop();}
  }).subscribe();
}

  if(data.length===0){
    const{data:ins}=await sb.from('recipes').insert(BASE_RECIPES).select();
    if(ins)recipes=ins.map(r=>({id:r.id,name:r.name,tag:r.tag,colorKey:r.color_key||'default',emoji:r.emoji||'🍽️'}));
  } else {
    recipes=data.map(r=>({id:r.id,name:r.name,tag:r.tag,colorKey:r.color_key||'default',emoji:r.emoji||'🍽️'}));
  }
  lsSave('recipes_cache',recipes);renderRecipes();
}
function subscribeRecipes(){
  sb.channel('recipes-rt').on('postgres_changes',{event:'*',schema:'public',table:'recipes'},payload=>{
    const{eventType,new:n,old:o}=payload;
    if(eventType==='INSERT'){if(!recipes.find(r=>r.id===n.id)){recipes.push({id:n.id,name:n.name,tag:n.tag,colorKey:n.color_key||'default',emoji:n.emoji||'🍽️'});lsSave('recipes_cache',recipes);renderRecipes();}}

}

// ===== PLANNING (repas) =====
function getWeekStart(offset){
  const d=new Date();const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const m=new Date(d);m.setDate(diff+offset*7);m.setHours(0,0,0,0);return m;
}
function getWeekLabel(offset){const m=getWeekStart(offset);return'Semaine du '+m.getDate()+' '+MONTHS[m.getMonth()];}
function changeWeek(dir){
  weekOffset+=dir;lsSave('weekOffset',weekOffset);
  document.getElementById('week-label').textContent=getWeekLabel(weekOffset);
  updateTodayBtn();renderPlanning();renderRecap();
}
function goToToday(){weekOffset=0;lsSave('weekOffset',0);document.getElementById('week-label').textContent=getWeekLabel(0);updateTodayBtn();renderPlanning();renderRecap();}
function updateTodayBtn(){const b=document.getElementById('today-btn');if(b)b.style.display=weekOffset===0?'none':'inline-block';}
function slotKey(di,slot){return weekOffset+'_'+di+'_'+slot;}
function isToday(di,offset=weekOffset){
  const ws=getWeekStart(offset);const d=new Date(ws);d.setDate(ws.getDate()+di);
  const now=new Date();return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
}
function getSlotData(key){const v=planning[key];if(!v)return null;if(typeof v==='number')return{recipe_id:v,free_text:null,exc_e:null,exc_c:null,exc_m:null};return v;}
function getSlotDisplay(key){
  const v=getSlotData(key);if(!v)return null;
  if(v.free_text)return{name:v.free_text,emoji:'📝',col:TAG_COLORS.free,isFree:true};
  const r=recipes.find(r=>r.id===v.recipe_id);if(!r)return null;
  return{name:r.name,emoji:r.emoji||'🍽️',col:TAG_COLORS[r.tag]||TAG_COLORS.free,isFree:false};
}

function buildCellHTML(key,sd,isCook){
  const v=getSlotData(key);
  const excE=v?v.exc_e:null,excC=v?v.exc_c:null,excM=v?v.exc_m:null;
  let html='<div class="cell-inner"><div class="meal-top"><span class="meal-name" style="color:'+sd.col.txt+'">'+sd.emoji+' '+esc(sd.name)+'</span>';
  html+='<button class="cell-remove" onclick="event.stopPropagation();removeSlot(\''+key+'\')" aria-label="retirer"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
  if(isCook)html+='<div class="cook-flag" style="margin-bottom:4px">dim. soir</div>';
  if(sd.isFree)html+='<div class="free-badge" style="margin-bottom:4px">à la volée</div>';
  html+='<div class="cell-footer"><div class="initials-row">';
  if(!excE)html+='<button class="initial-btn neutral-e" onclick="event.stopPropagation();openExceptionModal(\''+key+'\',\'e\')">E</button>';
  if(!excC)html+='<button class="initial-btn neutral-c" onclick="event.stopPropagation();openExceptionModal(\''+key+'\',\'c\')">C</button>';
  if(!excM)html+='<button class="initial-btn neutral-m" onclick="event.stopPropagation();openExceptionModal(\''+key+'\',\'m\')">M</button>';
  html+='</div>';
  [{key:'e',dot:'exception-dot-e',text:excE},{key:'c',dot:'exception-dot-c',text:excC},{key:'m',dot:'exception-dot-m',text:excM}].forEach(p=>{
    if(!p.text)return;
    html+='<div class="exception-line"><div class="exception-dot '+p.dot+'"></div>';
    html+='<button class="initial-btn neutral-'+p.key+'" style="width:18px;height:18px;font-size:9px;flex-shrink:0" onclick="event.stopPropagation();openExceptionModal(\''+key+'\',\''+p.key+'\')">'+p.key.toUpperCase()+'</button>';
    html+='<span class="exception-text">'+esc(p.text)+'</span></div>';
  });
  html+='</div></div>';return html;
}

function renderPlanning(){
  const container=document.getElementById('planning-rows');if(!container)return;
  container.innerHTML='';const ws=getWeekStart(weekOffset);
  ALL_DAYS.forEach((day,di)=>{
    const isWeekend=di>=5;
    const row=document.createElement('div');row.className='day-row'+(isWeekend?' weekend-row':'');
    const d=new Date(ws);d.setDate(ws.getDate()+di);
    const lbl=document.createElement('div');lbl.className='day-lbl';
    lbl.innerHTML='<span class="day-name">'+day+'</span><span class="day-num'+(isToday(di)?' today':'')+'">'+d.getDate()+'</span>';
    row.appendChild(lbl);
    ['midi','soir'].forEach(slot=>{
      const key=slotKey(di,slot);const sd=getSlotDisplay(key);
      const cell=document.createElement('div');cell.className='cell'+(sd?'':' empty');
      if(sd){cell.style.background=sd.col.bg;cell.style.borderColor=sd.col.bd;}
      const isCook=sd&&!sd.isFree&&((slot==='midi'&&di<=2)||(slot==='soir'&&di<=1));
      if(sd)cell.innerHTML=buildCellHTML(key,sd,isCook);
      else cell.innerHTML='<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
      cell.onclick=()=>openModal(key,day,slot);row.appendChild(cell);
    });
    container.appendChild(row);
  });
}

// ===== RECAP DIMANCHE =====
function renderRecap(){
  const el=document.getElementById('recap-content');if(!el)return;
  const targets=[{di:0,slot:'midi',label:'Lun midi'},{di:0,slot:'soir',label:'Lun soir'},{di:1,slot:'midi',label:'Mar midi'},{di:1,slot:'soir',label:'Mar soir'},{di:2,slot:'midi',label:'Mer midi'},{di:2,slot:'soir',label:'Mer soir'}];
  const items=targets.map(t=>{const key=slotKey(t.di,t.slot);const sd=getSlotDisplay(key);return sd?{label:t.label,sd}:null;}).filter(Boolean);
  if(!items.length){el.innerHTML='<div class="recap-section"><div class="recap-title">À cuisiner ce dimanche soir</div><div class="recap-empty">Aucun repas planifié pour lundi au mercredi.</div></div>';return;}
  const seen=new Set();const unique=[];

// ===== MENAGE =====
function getMenageWeekKey(offset){
  const m=getWeekStart(offset);return m.getFullYear()+'-W'+String(getISOWeek(m)).padStart(2,'0');
}
function getISOWeek(d){const jan4=new Date(d.getFullYear(),0,4);return Math.ceil(((d-jan4)/86400000+jan4.getDay()+1)/7);}
function changeMenageWeek(dir){menageWeekOffset+=dir;lsSave('menageWeekOffset',menageWeekOffset);document.getElementById('menage-week-label').textContent=getWeekLabel(menageWeekOffset);updateMenageTodayBtn();renderMenagePlanning();}
function goToMenageToday(){menageWeekOffset=0;lsSave('menageWeekOffset',0);document.getElementById('menage-week-label').textContent=getWeekLabel(0);updateMenageTodayBtn();renderMenagePlanning();}
function updateMenageTodayBtn(){const b=document.getElementById('menage-today-btn');if(b)b.style.display=menageWeekOffset===0?'none':'inline-block';}

function getTaskCompletion(taskId){
  const wk=getMenageWeekKey(menageWeekOffset);
  return menageCompletions.find(c=>c.task_id===taskId&&c.week_key===wk)||null;
}

function weeksSinceLastDone(taskId){
  const completions=menageCompletions.filter(c=>c.task_id===taskId&&c.done_date);
  if(!completions.length)return null;
  completions.sort((a,b)=>new Date(b.done_date)-new Date(a.done_date));
  const last=new Date(completions[0].done_date);
  const now=new Date();
  return Math.floor((now-last)/(7*86400000));
}

function shouldShowTask(task){
  const wk=getMenageWeekKey(menageWeekOffset);
  // Tâche à la volée (once sans due_date) : afficher uniquement la semaine de création
  if(task.recurrence==='once'&&!task.due_date){
    const taskWk=getMenageWeekKeyFromDate(new Date(task.created_at));
    return taskWk===wk||menageCompletions.some(c=>c.task_id===task.id&&c.week_key===wk);
  }
  // Tâche à date unique : afficher la semaine correspondant à la due_date
  if(task.recurrence==='once'&&task.due_date){
    const taskWk=getMenageWeekKeyFromDate(new Date(task.due_date));
    return taskWk===wk||menageCompletions.some(c=>c.task_id===task.id&&c.week_key===wk);
  }
  const rec={weekly:1,biweekly:2,monthly:4,yearly:52}[task.recurrence]||1;
  const created=new Date(task.created_at);
  const ws=getWeekStart(menageWeekOffset);
  const weeksDiff=Math.floor((ws-new Date(created.getFullYear(),0,4))/(7*86400000));
  return weeksDiff%rec===0||menageCompletions.some(c=>c.task_id===task.id&&c.week_key===wk);
}

function getMenageWeekKeyFromDate(d){
  return d.getFullYear()+'-W'+String(getISOWeek(d)).padStart(2,'0');
}

function renderMenagePlanning(){
  const el=document.getElementById('menage-task-list');if(!el)return;
  const tasks=menageTasks.filter(t=>shouldShowTask(t));
  if(!tasks.length){el.innerHTML='<div class="empty-state">Aucune tâche cette semaine</div>';return;}
  const groups={e:[],c:[],both:[]};
  tasks.forEach(t=>groups[t.assigned_to]?groups[t.assigned_to].push(t):groups.both.push(t));
  let html='';
  const renderGroup=(label,list)=>{
    if(!list.length)return;
    html+='<div class="menage-section-label">'+label+'</div>';
    list.forEach(t=>{
      const comp=getTaskCompletion(t.id);
      const weeks=!comp?weeksSinceLastDone(t.id):null;
      const isDone=!!comp;
      html+='<div class="menage-task'+(isDone?' done-task':'')+'\">';
      html+='<div class="menage-cb'+(isDone?' done':'')+'\" onclick="toggleMenageTask('+t.id+')">'+(isDone?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':'')+' </div>';
      html+='<div class="menage-task-info">';
      html+='<div class="menage-task-name'+(isDone?' done':'')+'">'+esc(t.name)+'</div>';
      if(isDone&&comp.done_by)html+='<div class="menage-task-meta">Fait par '+PERSON_LABELS[comp.done_by]+(comp.done_date?' le '+formatDate(comp.done_date):'')+'</div>';
      if(!isDone&&weeks!==null&&weeks>=1)html+='<div class="menage-task-warn">⚠️ Non fait depuis '+weeks+' semaine'+(weeks>1?'s':'')+'</div>';
      html+='<span class="recurrence-pill">'+RECURRENCE_LABELS[t.recurrence]+'</span>';
      html+='</div>';
      html+='<button class="menage-del" onclick="deleteMenageTask('+t.id+')" aria-label="supprimer"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>';
      html+='</div>';
    });
  };
  renderGroup('Edouard',groups.e);renderGroup('Coralie',groups.c);renderGroup('Les deux',groups.both);
  el.innerHTML=html;
}

function initSwipe(){
  let tx=0,ty=0,swiping=false;
  const THRESHOLD=60,RATIO=1.5;
  document.removeEventListener('touchstart',onTouchStart);
  document.removeEventListener('touchend',onTouchEnd);
  document.addEventListener('touchstart',onTouchStart,{passive:true});
  document.addEventListener('touchend',onTouchEnd,{passive:true});
}
function onTouchStart(e){const t=e.touches[0];window._swTx=t.clientX;window._swTy=t.clientY;}
function onTouchEnd(e){
  const t=e.changedTouches[0];const dx=t.clientX-window._swTx,dy=t.clientY-window._swTy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dir=dx<0?1:-1;
  if(currentSection==='repas'){const tabs=['planning','recettes','courses','recap'];const idx=tabs.indexOf(currentRepasTab);const next=tabs[idx+dir];if(next){showRepasTab(next,document.querySelectorAll('#repas-tabs .stab')[idx+dir]);}}
  else if(currentSection==='menage'){const tabs=['planning','config'];const idx=tabs.indexOf(currentMenageTab);const next=tabs[idx+dir];if(next){showMenageTab(next,document.querySelectorAll('#section-menage .stab')[idx+dir]);}}
}

  const tabIdx=tabOrder.indexOf(firstTab);
  const stabs=document.querySelectorAll('#repas-tabs .stab');
  if(stabs[tabIdx])stabs[tabIdx].classList.add('active');
}
initSwipe();

(async()=>{
  await loadShopFromSupabase();
  await loadRecipesFromSupabase();
  await loadPlanningFromSupabase();
  await loadMenageFromSupabase();
  await loadTodoFromSupabase();
  renderPlanning();renderSuggestion();renderEmojiPicker();
  setTimeout(()=>{subscribeShop();subscribeRecipes();subscribePlanning();subscribeMenage();subscribeTodo();},800);
})();
</script>
